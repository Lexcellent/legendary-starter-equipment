[mod-name]
legendary-starter-equipment=传说品质开局装备

[mod-description]
legendary-starter-equipment=每名新建玩家开局获得300个普通品质建设机器人，以及一套固定的传说品质太空时代装备。

[legendary-starter-equipment]
items-granted=传说品质开局装备已放入背包。
inventory-full=主背包空间不足，无法放入 __1__ 个 __2__。
missing-item=无法发放物品，未找到物品原型：__1__

[mod-setting-name]
legendary-starter-equipment-worker-robot-cargo-level=作业机器人货物运量科研等级
legendary-starter-equipment-worker-robot-speed-level=作业机器人速度科研等级

[mod-setting-description]
legendary-starter-equipment-worker-robot-cargo-level=选择作业机器人货物运量科研等级（0–3），修改后立即应用到所在阵营。同一阵营有多名玩家时，以最后修改的设置为准。
legendary-starter-equipment-worker-robot-speed-level=选择作业机器人速度科研等级（0–6），修改后立即应用到所在阵营。同一阵营有多名玩家时，以最后修改的设置为准。
